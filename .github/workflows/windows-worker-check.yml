name: Packaged Windows worker check
on:
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful Fork Windows build run to test
        required: true
        type: string
permissions:
  contents: read
  actions: read
jobs:
  workers:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BeamNG-Earth-Windows
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.run_id }}
      - name: Test frozen worker startup and queue recovery
        shell: pwsh
        run: |
          $app = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $app) { throw 'No packaged app' }
          & $app.FullName --run-addon tools/check_worker_pools.py
          if ($LASTEXITCODE -ne 0) { throw "Worker check failed: $LASTEXITCODE" }
