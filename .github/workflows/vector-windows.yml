name: Vector maps Windows experiment

on:
  push:
    branches: [experiment/maplibre-dashboard]
  workflow_dispatch:
    inputs:
      build_native:
        description: Rebuild native kernels (disable only for Python-only hotfixes using the checked-in module)
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Canvas2D renderer
        working-directory: tools/vector_canvas
        run: |
          npm ci
          npm test
          npm run build
      - name: Mark the experimental build
        shell: bash
        run: printf '%s.maplibre.%s\n' "$(cat VERSION)" '${{ github.run_number }}' > VERSION
      - name: Rust kernels
        if: github.event_name != 'workflow_dispatch' || inputs.build_native
        run: python tools/build_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: BeamNG-Earth-native-Windows
          path: server/earthfast.pyd
          if-no-files-found: error
      - name: Python packages
        run: python -m pip install pyinstaller==6.22.3 -r server/requirements.txt
      - name: Validate reused native kernel
        if: github.event_name == 'workflow_dispatch' && !inputs.build_native
        run: python -c "import sys; sys.path.insert(0, 'server'); import fast; fast.require(fast.MIN_VERSION, 'hotfix build'); print('earthfast', fast._ef.VERSION)"
      - name: Vector transport checks
        run: |
          python -m unittest discover -s server/tests -p test_vectorresources.py
          node --test mod/tests/test_vectorresources.mjs mod/tests/test_mapmath.mjs
      - name: Russian signs and native rendering checks
        run: |
          python -m unittest discover -s server/tests -p test_ru_signs.py
          python -m unittest discover -s server/tests -p test_ru_infrastructure.py
          python -m unittest discover -s server/tests -p test_roadsigns.py
          python -m unittest discover -s server/tests -p test_signcodes.py
          python -m unittest discover -s server/tests -p test_townentry.py
          python -m unittest discover -s server/tests -p test_dirsigns.py
          python -m unittest discover -s server/tests -p test_highway_signs.py
      - name: Road geometry and terrain integration gate
        run: |
          python tools/run_tests.py test_asyncsubmit test_staging test_logqueue test_matslots test_tilepublish test_stream_reconnect test_runtimeprofiler_server --par 2 --timeout 180 --logs build/stream-integration-tests
          python tools/run_tests.py test_ru_infrastructure test_furniture test_buildings test_roads test_blockworker test_markings test_sign_packaging test_walk_clearance test_sidewalk_collision test_islands test_roadcorners test_carriageway_cell_seams test_junction_landing test_junction_corridor test_junction_pads test_approaches test_bridge_junction_surface test_building_passages test_bridge_chain_clearance test_grading test_under_deck test_underpass_profiles test_bridge_clearance test_bake_formats test_crossings test_carriageways test_worldbundle test_host_package test_package_stamps --par 2 --timeout 180 --logs build/road-integration-tests
      - name: Reported world geometry regressions
        run: python tools/run_tests.py test_abutment_pad test_gradesep test_bridgeattachments test_railways test_footbridges test_guardrails test_powerlines test_power_clearance test_vegetation test_building_overrides test_lamp_collision test_seacarve --par 2 --timeout 180 --logs build/road-integration-tests
      - name: Nonblocking tile publication and affinity
        run: python tools/run_tests.py test_tilepublish test_colormatch test_cpupin --par 2 --logs build/road-integration-tests
      - name: Record tested dependency versions
        if: always()
        shell: bash
        run: |
          mkdir -p build
          python -m pip freeze > build/tested-python-packages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: road-integration-diagnostics
          path: |
            build/road-integration-tests/*.log
            build/tested-python-packages.txt
          if-no-files-found: warn
      - name: Lua sign and streaming checks
        run: |
          python -m pip install lupa==2.8
          python tools/run_lua_tests.py test_roadsigns test_townsigns test_roads test_trees test_groundcover test_scoping test_core_robustness test_core_stubbed test_settings
      - name: Bootloader from source
        run: python tools/build_bootloader.py
      - name: Build the exe
        run: python tools/build_app.py --require-own-bootloader
      - name: Smoke test packaged server
        shell: bash
        run: |
          f=$(ls dist/*.exe)
          "$f" --server --help > help.txt
          head -3 help.txt
          "$f" --world-cache --help > world-cache-help.txt
      - name: Package source and BeamMP mod
        run: python tools/package.py --out dist --beammp
      - uses: actions/upload-artifact@v4
        with:
          name: BeamNG-Earth-MapLibre-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error
