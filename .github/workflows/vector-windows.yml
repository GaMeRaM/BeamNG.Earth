name: Fork Windows build

on:
  push:
    branches: [experiment/maplibre-dashboard]
  workflow_dispatch:
    inputs:
      build_native:
        description: Rebuild native kernels (disable only for Python-only hotfixes using the checked-in module)
        type: boolean
        default: true
      worker_check_run:
        description: Test worker queues of an existing build run only (empty builds the app)
        type: string
        default: ''
      world_check:
        description: Include real cached/downloaded roads, trees and buildings in worker check
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

jobs:
  windows:
    if: github.event.inputs.worker_check_run == ''
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Canvas2D renderer
        working-directory: tools/vector_canvas
        run: |
          npm ci
          npm test
          npm run build
      - name: Mark the fork build
        shell: bash
        run: printf '%s.%s\n' "$(cat VERSION)" '${{ github.run_number }}' > VERSION
      - name: Rust kernels
        if: github.event_name != 'workflow_dispatch' || inputs.build_native
        run: python tools/build_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: BeamNG-Earth-native-Windows
          path: server/earthfast.pyd
          if-no-files-found: error
      - name: Python packages
        run: python -m pip install pyinstaller==6.22.3 -r server/requirements.txt
      - name: Validate reused native kernel
        if: github.event_name == 'workflow_dispatch' && !inputs.build_native
        run: python -c "import sys; sys.path.insert(0, 'server'); import fast; fast.require(fast.MIN_VERSION, 'hotfix build'); print('earthfast', fast._ef.VERSION)"
      - name: Vector transport checks
        run: |
          python -m unittest discover -s server/tests -p test_vectorresources.py
          node --test mod/tests/test_vectorresources.mjs mod/tests/test_mapmath.mjs
      - name: Russian signs and native rendering checks
        run: |
          python -m unittest discover -s server/tests -p test_ru_signs.py
          python -m unittest discover -s server/tests -p test_ru_infrastructure.py
          python -m unittest discover -s server/tests -p test_roadsigns.py
          python -m unittest discover -s server/tests -p test_signcodes.py
          python -m unittest discover -s server/tests -p test_townentry.py
          python -m unittest discover -s server/tests -p test_dirsigns.py
          python -m unittest discover -s server/tests -p test_highway_signs.py
      - name: Road geometry and terrain integration gate
        run: |
          python tools/run_tests.py test_watchdog_cpu test_shared_gate test_building_parts_rules test_nycshards test_rail_underpass_metadata test_prefetch_chain test_bridge_auto test_beach_prefix test_carriageway_components test_beaches test_asyncsubmit test_workcancel test_plancache test_runtimeprofiler test_staging test_logqueue test_matslots test_tilepublish test_stream_reconnect test_runtimeprofiler_server --par 2 --timeout 180 --logs build/stream-integration-tests
          python tools/run_tests.py test_ru_infrastructure test_furniture test_buildings test_roads test_blockworker test_markings test_sign_packaging test_walk_clearance test_sidewalk_collision test_islands test_roadcorners test_carriageway_cell_seams test_junction_landing test_junction_corridor test_junction_pads test_approaches test_bridge_junction_surface test_building_passages test_bridge_chain_clearance test_grading test_under_deck test_underpass_profiles test_bridge_clearance test_bake_formats test_crossings test_carriageways test_carriageway_solver test_worldbundle test_host_package test_package_stamps --par 2 --timeout 180 --logs build/road-integration-tests
      - name: Imported road, memory and texture regressions
        run: python tools/run_tests.py test_budget test_shed test_lanesections test_width_model test_roadsmooth test_roadsurf test_corridors test_deck_ground test_rail_yield test_roadz_hk test_heightmap test_mod_textures test_build_s2_packs test_dem test_geodesy test_regional_revision --par 2 --timeout 600 --logs build/road-integration-tests
      - name: Imported upstream regression checks
        run: python tools/run_tests.py test_native_threads test_paintlist test_ground_rules test_chain_short test_chainview_prefer test_subsea_final test_stale_revisit test_build_decisions test_server_list test_preload_place test_enu_ahead test_regional_geotiles test_decisions test_latework test_enginepatch_terfast test_aerialpacks test_base_photo_revisit test_blockcache test_bnwt test_farrestore test_photo_lawns_in_use test_revisit_scopes test_world_reset test_border_welcomes test_determinism test_drivability test_laned_streets test_launcher_lifecycle test_launcher_linux test_launcher_update test_mapdata_singleflight test_median_noses test_navgraph test_osmwelcomes test_photo_sources test_places_api test_plan_order test_pmtiles test_poles_on_roads test_protocol_agreement test_rail_underpass_signs test_rails test_recreation_expansion test_reportsend test_restart test_revisit test_roadwidth test_route_retry test_routing test_rural_lighting test_selfupdate test_travelboards test_v131_default test_memwatch test_portals test_road_clearance test_roadlayercache test_speed242 test_tilecuts test_deckjoins test_deckpad_levels test_warm_queue test_abandon test_reach test_revisit_side test_revisitpack test_grade_binned test_farpvs test_ground_standin test_ground_square test_far_first test_halo_reads test_enginepatch test_prov_refresh test_veg_geo_jobs test_netfetch test_netstate test_imagery test_osm_tag_shards test_lod2roofs test_nycmassing test_railtags --par 2 --timeout 600 --logs build/road-integration-tests
      - name: Synthetic server sessions
        run: python tools/run_tests.py test_server --par 1 --timeout 600 --logs build/road-integration-tests
      - name: Reported world geometry regressions
        run: python tools/run_tests.py test_abutment_pad test_gradesep test_bridgeattachments test_railways test_railprofile test_geotiles test_roadgeo test_fargeo test_osmfuel_tiles test_footbridges test_guardrails test_powerlines test_power_clearance test_vegetation test_building_overrides test_lamp_collision test_seacarve --par 2 --timeout 180 --logs build/road-integration-tests
      - name: Nonblocking tile publication and affinity
        run: python tools/run_tests.py test_tilepublish test_colormatch test_cpupin --par 2 --logs build/road-integration-tests
      - name: Record tested dependency versions
        if: always()
        shell: bash
        run: |
          mkdir -p build
          python -m pip freeze > build/tested-python-packages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: road-integration-diagnostics
          path: |
            build/road-integration-tests/*.log
            build/tested-python-packages.txt
          if-no-files-found: warn
      - name: Lua sign and streaming checks
        run: |
          python -m pip install lupa==2.8
          python tools/run_lua_tests.py test_edgeguard test_collisiontrace test_roadsigns test_townsigns test_roads test_trees test_groundcover test_scoping test_core_robustness test_core_stubbed test_drophold test_rebase test_simhold test_settings test_beammp test_codeswap test_loadprogress test_gcpace
      - name: Bootloader from source
        run: python tools/build_bootloader.py
      - name: Build the exe
        run: python tools/build_app.py --require-own-bootloader
      - name: Smoke test packaged server
        shell: bash
        run: |
          f=$(ls dist/*.exe)
          "$f" --server --help > help.txt
          head -3 help.txt
          "$f" --world-cache --help > world-cache-help.txt
          "$f" --run-addon tools/check_worker_pools.py
      - name: Package source and BeamMP mod
        run: python tools/package.py --out dist --beammp
      - uses: actions/upload-artifact@v4
        with:
          name: BeamNG-Earth-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Real generation through packaged worker queues
        if: github.event_name == 'push' || inputs.world_check
        shell: pwsh
        run: |
          $app = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          & $app.FullName --run-addon tools/check_worker_pools.py --world --online --cache "$env:RUNNER_TEMP/bnge-worker-world-cache"
          if ($LASTEXITCODE -ne 0) { throw "World worker check failed: $LASTEXITCODE" }

  worker-check:
    if: github.event.inputs.worker_check_run != ''
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BeamNG-Earth-Windows
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.worker_check_run }}
      - name: Test frozen worker startup and queue recovery
        shell: pwsh
        run: |
          $app = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $app) { throw 'No packaged app' }
          if ('${{ inputs.world_check }}' -eq 'true') {
            & $app.FullName --run-addon tools/check_worker_pools.py --world --online --cache "$env:RUNNER_TEMP/bnge-worker-world-cache"
          } else {
            & $app.FullName --run-addon tools/check_worker_pools.py
          }
          if ($LASTEXITCODE -ne 0) { throw "Worker check failed: $LASTEXITCODE" }
