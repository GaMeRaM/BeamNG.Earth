name: Fork Windows build

on:
  push:
    branches: [experiment/maplibre-dashboard]
  workflow_dispatch:
    inputs:
      build_native:
        description: Rebuild native kernels (disable only when checked-in modules match the current native sources)
        type: boolean
        default: true
      worker_check_run:
        description: Test worker queues of an existing build run only (empty builds the app)
        type: string
        default: ''
      world_check:
        description: Include real cached/downloaded roads, trees and buildings in worker check
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

env:
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8

defaults:
  run:
    shell: bash

jobs:
  windows:
    if: github.event.inputs.worker_check_run == ''
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13.15'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Canvas2D renderer
        working-directory: tools/vector_canvas
        run: |
          npm ci
          npm test
          npm run build
      - name: Mark the fork build
        shell: bash
        run: printf '%s.%s\n' "$(cat VERSION)" '${{ github.run_number }}' > VERSION
      - name: Rust kernels
        if: github.event_name != 'workflow_dispatch' || inputs.build_native
        run: python tools/build_native.py
      - uses: actions/upload-artifact@v4
        with:
          name: BeamNG-Earth-native-Windows
          path: server/earthfast.pyd
          if-no-files-found: error
      - name: Python packages
        run: python -m pip install pyinstaller==6.22.3 zstandard==0.25.0 -r server/requirements.txt
      - name: Validate reused native kernel
        if: github.event_name == 'workflow_dispatch' && !inputs.build_native
        run: python -c "import sys; sys.path.insert(0, 'server'); import fast; fast.require(fast.MIN_VERSION, 'hotfix build'); print('earthfast', fast._ef.VERSION)"
      - name: Portable test runner, decoder bounds and cache format
        run: python tools/run_tests.py test_test_runner test_budget test_bake_formats test_detail test_osm_building_colours test_osm_building_years test_bridge_copy_identity --par 1 --timeout 180 --logs build/portability-tests
      - name: New upstream regression checks
        run: python tools/run_tests.py test_build_mt_bindings test_experimental test_gameinstall test_ground_lines_near test_launcher_packaging test_mtarchive test_pools test_ramp_envelope test_srvrestart test_telemetry --par 2 --timeout 600 --logs build/road-integration-tests
      - name: Imported host, canopy and data regressions
        run: python tools/run_tests.py test_host test_railxing_corridor test_genground_blockfade test_genground_far test_hrdem_covers test_plan_neutral test_session_report test_areaprops test_german_roads --par 2 --timeout 600 --logs build/road-integration-tests
      - name: Imported roadnet, geometry and asset checks
        run: python tools/run_tests.py test_deck_k_speed test_european_sidewalks test_highway_signs test_hold_abut test_home_ranges test_navband test_racedig test_roadnet_assembly test_roadnet_countries test_roadnet_eustreets test_roadnet_flowhome test_roadnet_joint_desc test_roadnet_laneflow test_roadnet_lanesplit test_roadnet_layout test_roadnet_levelkinds test_roadnet_regions test_roadnet_rings test_roadnet_spec_columns test_roadnet_splitlayer test_roadnet_surfaces test_roadnet_verdicts test_roadnet_width_regions test_routing_valhalla test_seams test_shape_lods test_width_repair --par 2 --timeout 600 --logs build/road-integration-tests
      - name: Imported terrain, crossings and native regressions
        run: python tools/run_tests.py test_dem_short test_initial_loading test_lanesjoin_native test_npyguard test_onewayjoin_native test_osmjoin_native test_osmrows_native test_osmtags test_railroadseam test_railstations test_roadnet_countrylookup test_roadnet_overrides test_roadnet_specjson test_roadnet_widthlanes test_skiramps test_structprobe test_textcol_native --par 2 --timeout 600 --logs build/road-integration-tests
      - name: Vector transport checks
        run: |
          python -m unittest discover -s server/tests -p test_vectorresources.py
          node --test mod/tests/test_ui_lifecycle.mjs mod/tests/test_restart_box.mjs mod/tests/test_vectorresources.mjs mod/tests/test_mapmath.mjs mod/tests/test_mapsearch.mjs mod/tests/test_paste.mjs
      - name: Russian signs and native rendering checks
        run: |
          python -m unittest discover -s server/tests -p test_ru_stop_lines.py
          python -m unittest discover -s server/tests -p test_ru_crossing_layout.py
          python -m unittest discover -s server/tests -p test_ru_localization.py
          python -m unittest discover -s server/tests -p test_speed_signs.py
          python -m unittest discover -s server/tests -p test_railxing.py
          python -m unittest discover -s server/tests -p test_secrossings.py
          python -m unittest discover -s server/tests -p test_ru_signs.py
          python -m unittest discover -s server/tests -p test_ru_infrastructure.py
          python -m unittest discover -s server/tests -p test_roadsigns.py
          python -m unittest discover -s server/tests -p test_signcodes.py
          python -m unittest discover -s server/tests -p test_townentry.py
          python -m unittest discover -s server/tests -p test_dirsigns.py
          python -m unittest discover -s server/tests -p test_highway_signs.py
      - name: Road geometry and terrain integration gate
        run: |
          python tools/run_tests.py test_deckspans test_farglobal test_lidarz test_rail_yield test_veg_geo_jobs test_veg_cell_singleflight test_serverlist_pages test_terrainprefill test_tls_context test_bldhz test_geocode_categories test_road_underpass_signs test_watchdog_cpu test_shared_gate test_building_parts_rules test_nycshards test_rail_underpass_metadata test_prefetch_chain test_bridge_auto test_beach_prefix test_carriageway_components test_beaches test_asyncsubmit test_workcancel test_plancache test_runtimeprofiler test_staging test_logqueue test_matslots test_tilepublish test_stream_reconnect test_runtimeprofiler_server --par 2 --timeout 180 --logs build/stream-integration-tests
          python tools/run_tests.py test_ru_infrastructure test_furniture test_buildings test_roads test_blockworker test_markings test_sign_packaging test_walk_clearance test_sidewalk_collision test_islands test_roadcorners test_carriageway_cell_seams test_junction_landing test_junction_corridor test_junction_pads test_approaches test_bridge_junction_surface test_building_passages test_bridge_chain_clearance test_grading test_under_deck test_underpass_profiles test_bridge_clearance test_crossings test_carriageways test_carriageway_solver test_host_package test_package_stamps --par 2 --timeout 180 --logs build/road-integration-tests
      - name: Imported road, memory and texture regressions
        run: python tools/run_tests.py test_budget test_shed test_lanesections test_width_model test_roadsmooth test_roadsurf test_corridors test_deck_ground test_rail_yield test_roadz_hk test_heightmap test_mod_textures test_build_s2_packs test_dem test_geodesy test_regional_revision --par 2 --timeout 600 --logs build/road-integration-tests
      - name: Imported upstream regression checks
        run: python tools/run_tests.py test_native_threads test_paintlist test_ground_rules test_chain_short test_chainview_prefer test_subsea_final test_stale_revisit test_build_decisions test_server_list test_preload_place test_enu_ahead test_regional_geotiles test_decisions test_latework test_enginepatch_terfast test_aerialpacks test_base_photo_revisit test_blockcache test_bnwt test_farrestore test_photo_lawns_in_use test_revisit_scopes test_world_reset test_border_welcomes test_determinism test_drivability test_laned_streets test_launcher_lifecycle test_launcher_linux test_launcher_update test_mapdata_singleflight test_median_noses test_navgraph test_osmwelcomes test_photo_sources test_places_api test_plan_order test_pmtiles test_poles_on_roads test_protocol_agreement test_rail_underpass_signs test_rails test_recreation_expansion test_reportsend test_restart test_revisit test_roadwidth test_route_retry test_routing test_rural_lighting test_selfupdate test_travelboards test_v131_default test_memwatch test_portals test_road_clearance test_roadlayercache test_speed242 test_tilecuts test_deckjoins test_deckpad_levels test_warm_queue test_abandon test_reach test_revisit_side test_revisitpack test_grade_binned test_farpvs test_ground_standin test_ground_square test_far_first test_halo_reads test_enginepatch test_prov_refresh test_veg_geo_jobs test_netfetch test_threedmr test_netstate test_imagery test_osm_tag_shards test_lod2roofs test_nycmassing test_railtags --par 2 --timeout 600 --logs build/road-integration-tests
      - name: Imported search, horizon and imagery recovery checks
        run: python tools/run_tests.py test_areas test_countrybounds test_credits test_graphics test_retex --par 2 --timeout 600 --logs build/road-integration-tests
      - name: Generated ground and roofs regression checks
        run: python tools/run_tests.py test_genground test_genground_roofs test_genground_v2 test_genground_v3 test_genground_v4 test_genground_v5 test_ground_looks test_env_keys test_portcheck test_speed_tapers test_level_spacing test_roadmesh test_roadlanes test_terraintex --par 2 --timeout 180 --logs build/road-integration-tests
      - name: Synthetic server sessions
        run: python tools/run_tests.py test_server --par 1 --timeout 600 --logs build/road-integration-tests
      - name: Reported world geometry regressions
        run: python tools/run_tests.py test_dnp_matmul_native test_osmml test_overture_release test_rail_index test_railbeds_native test_structures test_bake_formats test_abutment_pad test_gradesep test_bridgeattachments test_railways test_railprofile test_geotiles test_roadgeo test_fargeo test_osmfuel_tiles test_footbridges test_guardrails test_powerlines test_power_clearance test_vegetation test_building_overrides test_lamp_collision test_seacarve --par 2 --timeout 180 --logs build/road-integration-tests
      - name: Nonblocking tile publication and affinity
        run: python tools/run_tests.py test_tilepublish test_colormatch test_cpupin --par 2 --logs build/road-integration-tests
      - name: Record tested dependency versions
        if: always()
        shell: bash
        run: |
          mkdir -p build
          python -m pip freeze > build/tested-python-packages.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: road-integration-diagnostics
          path: |
            build/portability-tests/*.log
            build/stream-integration-tests/*.log
            build/road-integration-tests/*.log
            build/tested-python-packages.txt
          if-no-files-found: warn
      - name: Lua sign and streaming checks
        run: |
          python -m pip install lupa==2.8
          python tools/run_lua_tests.py test_autodrive_signals test_gps_recovery_lane test_obstacle_probe_budget test_oncomingPass_settings test_oncoming_pass test_oncoming_pass_runtime test_staticObstacles_settings test_static_obstacle_lane_transitions test_static_obstacle_surface test_static_obstacles test_static_obstacles_runtime test_deckguard test_places test_mpdefer test_mpsession test_framepacer test_governor test_issuefmt test_farpack test_gps test_gps_autodrive test_parking test_weather test_edgeguard test_collisiontrace test_roadsigns test_townsigns test_roads test_trees test_groundcover test_scoping test_core_robustness test_core_stubbed test_junction_approaches test_navgraph test_roadgeo test_drophold test_rebase test_simhold test_settings test_beammp test_codeswap test_loadprogress test_gcpace
      - name: Bootloader from source
        run: python tools/build_bootloader.py
      - name: Build the exe
        run: python tools/build_app.py --require-own-bootloader
      - name: Smoke test packaged server
        shell: bash
        run: |
          f=$(ls dist/*.exe)
          "$f" --server --help > help.txt
          head -3 help.txt
          "$f" --run-addon tools/check_worker_pools.py
          BNE_GEN_GROUND=on "$f" --run-addon tools/check_generated_ground.py
      - name: Package source and BeamMP mod
        run: python tools/package.py --out dist --beammp
      - uses: actions/upload-artifact@v4
        with:
          name: BeamNG-Earth-Windows
          path: |
            dist/*.exe
            dist/*.zip
          if-no-files-found: error

      - name: Real generation through packaged worker queues
        if: github.event_name == 'push' || inputs.world_check
        shell: pwsh
        run: |
          $app = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          & $app.FullName --run-addon tools/check_worker_pools.py --world --online --cache "$env:RUNNER_TEMP/bnge-worker-world-cache"
          if ($LASTEXITCODE -ne 0) { throw "World worker check failed: $LASTEXITCODE" }

  worker-check:
    if: github.event.inputs.worker_check_run != ''
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: BeamNG-Earth-Windows
          path: dist
          github-token: ${{ github.token }}
          run-id: ${{ inputs.worker_check_run }}
      - name: Test frozen worker startup and queue recovery
        shell: pwsh
        run: |
          $app = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $app) { throw 'No packaged app' }
          if ('${{ inputs.world_check }}' -eq 'true') {
            & $app.FullName --run-addon tools/check_worker_pools.py --world --online --cache "$env:RUNNER_TEMP/bnge-worker-world-cache"
          } else {
            & $app.FullName --run-addon tools/check_worker_pools.py
          }
          if ($LASTEXITCODE -ne 0) { throw "Worker check failed: $LASTEXITCODE" }
